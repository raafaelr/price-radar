name: Conferir precos
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_check.py && python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "price-radar"
          git config user.email "price-radar@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet || (git commit -m "precos" && git push)
