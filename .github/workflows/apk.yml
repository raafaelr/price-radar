name: Gerar APK
on:
  push:
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle -p android assembleDebug --no-daemon
      - run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Price Radar APK" --notes "Baixe app-debug.apk no celular e instale."
        env:
          GH_TOKEN: ${{ github.token }}
