<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Radar</title>
<style>
  body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
  h1{font-size:20px;margin:0 0 12px}
  .item{background:#1c1c1c;border-radius:10px;padding:12px;margin-bottom:10px}
  .item a{color:#8ab4ff;text-decoration:none}
  .now{font-size:22px;font-weight:700}
  .down{color:#4ade80}.up{color:#f87171}.muted{color:#999;font-size:13px}
  input,button{font:inherit;padding:10px;border-radius:8px;border:0}
  input{width:100%;box-sizing:border-box;margin-bottom:8px}
  button{background:#2b2b2b;color:#eee;margin:0 6px 6px 0}
  .add{display:inline-block;background:#2563eb;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:16px}
</style>
</head>
<body>
<h1>Price Radar</h1>
<a class="add" href="https://github.com/raafaelr/price-radar/edit/main/docs/items.json">+ Adicionar item</a>
<div id="list">Carregando...</div>

<h1 style="margin-top:24px">Buscar outro produto</h1>
<input id="q" placeholder="Ex: headset HyperX Cloud III">
<div id="stores"></div>

<script>
const brl = n => n.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const stores = {
  "Zoom": "https://www.zoom.com.br/search?q=",
  "KaBuM": "https://www.kabum.com.br/busca/",
  "Pichau": "https://www.pichau.com.br/search?q=",
  "Amazon": "https://www.amazon.com.br/s?k=",
  "Mercado Livre": "https://lista.mercadolivre.com.br/"
};
document.getElementById("stores").innerHTML = Object.keys(stores)
  .map(s => `<button onclick="go('${s}')">${s}</button>`).join("");
function go(s) {
  const q = document.getElementById("q").value.trim();
  if (q) location.href = stores[s] + encodeURIComponent(q); // a casca abre lojas no navegador
}

const RAW = "https://raw.githubusercontent.com/raafaelr/price-radar/main/docs/";
Promise.all([
  fetch(RAW + "items.json").then(r => r.json()),
  fetch(RAW + "prices.json").then(r => r.ok ? r.json() : {})
]).then(([items, prices]) => {
  document.getElementById("list").innerHTML = items.map(it => {
    const h = prices[it.url] || [];
    if (!h.length) return `<div class="item"><a href="${it.url}">${it.name}</a><div class="muted">ainda sem leitura</div></div>`;
    const now = h[h.length - 1][1], min = Math.min(...h.map(p => p[1])), prev = h.length > 1 ? h[h.length - 2][1] : now;
    const cls = now < prev ? "down" : now > prev ? "up" : "";
    const when = new Date(h[h.length - 1][0] * 1000).toLocaleString("pt-BR");
    return `<div class="item"><a href="${it.url}">${it.name}</a>
      <div class="now ${cls}">${brl(now)}</div>
      <div class="muted">menor visto: ${brl(min)}${it.target ? " · meta: " + brl(it.target) : ""} · ${when}</div></div>`;
  }).join("");
}).catch(e => document.getElementById("list").textContent = "Erro ao carregar: " + e);
</script>
</body>
</html>
