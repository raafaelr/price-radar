<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Price Radar</title>
<style>
  :root{--bg:#0f1115;--surface:#181b22;--line:#2a2f3a;--text:#eceff4;--muted:#a3a9b6;
        --accent:#2563eb;--good:#4ade80;--bad:#f87171;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif;
       padding:16px calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
       padding-top:calc(16px + env(safe-area-inset-top))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
  h1{font-size:22px;line-height:1.2;margin:0}
  h2{font-size:16px;margin:0 0 8px;font-weight:600}
  svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;
       border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);
       font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
  .price{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
  .tag{font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
  .good{color:var(--good)}.bad{color:var(--bad)}
  .muted{color:var(--muted);font-size:14px}
  .spark{width:100%;height:36px;margin:8px 0;color:var(--muted)}
  .actions{margin-top:8px}
  label{display:block;font-weight:600;margin-bottom:8px}
  input{width:100%;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
        background:var(--bg);color:var(--text);font:inherit}
  .stores{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:8px 0}
  .chip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;white-space:nowrap;cursor:pointer}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
  .res{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
  .res img{width:88px;height:88px;object-fit:contain;background:#fff;border-radius:10px}
  .res h3{font-size:15px;font-weight:600;margin:0 0 4px;line-height:1.3}
  .res .price{font-size:22px}
  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9}
  .drawer.open{display:block}
  .panel{position:absolute;inset:0 0 0 auto;width:min(92vw,380px);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;
         padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 16px;padding-top:calc(16px + env(safe-area-inset-top))}
  fieldset{border:0;padding:0;margin:0 0 16px}
  legend{font-weight:700;margin-bottom:8px;padding:0}
  .opt{display:flex;align-items:center;gap:12px;min-height:44px}
  .opt input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  select{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;padding:0 12px}
  .skel{height:150px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Price Radar</h1>
  <a class="btn primary" href="https://github.com/raafaelr/price-radar/edit/main/docs/items.json">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Adicionar
  </a>
</header>

<main id="list" aria-live="polite"><div class="card skel"></div><div class="card skel"></div></main>

<section class="card" id="cat">
  <h2>Catálogo multi-loja</h2>
  <form id="sf" role="search">
    <label for="q">O que você quer comparar?</label>
    <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Ex: processador, headset, SSD 1TB">
  </form>
  <div class="chips" id="chips" aria-label="Categorias"></div>
  <div class="bar"><span class="muted" id="count"></span>
    <button class="btn" id="fbtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>Filtros</button></div>
  <div id="res" aria-live="polite"></div>
  <details><summary class="muted" style="min-height:44px;display:flex;align-items:center">Configurar botão Rastrear</summary>
    <label for="tok">Token do GitHub (só neste celular)</label>
    <input id="tok" type="password" autocomplete="off" placeholder="github_pat_...">
    <p class="muted">Crie em GitHub › Settings › Developer settings › Fine-grained tokens, só para o repo price-radar, com Contents: Read and write.</p>
  </details>
</section>
<div class="drawer" id="drawer"><div class="panel" role="dialog" aria-modal="true" aria-label="Filtros">
  <div class="bar"><h2>Filtros</h2><button class="btn" id="fclose">Fechar</button></div>
  <fieldset><legend>Ordenar por</legend><select id="sort" aria-label="Ordenar por">
    <option value="rel">Mais relevantes</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></fieldset>
  <fieldset><legend>Faixa de preço</legend><div class="two">
    <div><label for="pmin" class="muted">Mínimo (R$)</label><input id="pmin" inputmode="numeric"></div>
    <div><label for="pmax" class="muted">Máximo (R$)</label><input id="pmax" inputmode="numeric"></div></div></fieldset>
  <fieldset id="fbrand"><legend>Marca</legend></fieldset>
  <fieldset id="fstore"><legend>Loja</legend></fieldset>
  <button class="btn" id="fclear">Limpar filtros</button>
</div></div>

<script>
const RAW = "https://raw.githubusercontent.com/raafaelr/price-radar/main/docs/";
const brl = n => n.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const CATS = ["Processador","Placa de vídeo","Placa-mãe","Memória RAM","SSD","Mouse gamer","Teclado gamer","Headset gamer","Monitor"];
const BRANDS = ["AMD","Intel","NVIDIA","Gigabyte","Asus","MSI","Corsair","Kingston","Samsung","Logitech","Razer","HyperX","Redragon","Attack Shark","SteelSeries","Pichau","XPG","Crucial","WD","Seagate","Lenovo","LG","AOC","Acer","Dell","TP-Link","Zowie","Cooler Master","Sony","JBL"];
const q = document.getElementById("q"), $ = id => document.getElementById(id);
let all = [], F = {brand: new Set(), store: new Set(), sort: "rel", min: null, max: null};

// Pega o HTML pelo celular (Net.get, sem CORS); no navegador comum cai no fetch.
const pend = {};
window.__net = (id, st, body) => { const p = pend[id]; delete pend[id]; if (p) st >= 200 && st < 300 ? p.ok(body) : p.no(st); };
function getHtml(url) {
  return new Promise((ok, no) => {
    if (window.Net) { const id = Math.random().toString(36).slice(2); pend[id] = {ok, no}; Net.get(id, url); }
    else fetch(url).then(r => r.ok ? r.text() : no(r.status)).then(ok, no);
  });
}
const num = t => { const m = /R\$\s*([\d.]+,\d{2})/.exec(t || ""); return m ? parseFloat(m[1].replace(/\./g, "").replace(",", ".")) : null; };
const brandOf = n => { const l = n.toLowerCase(); return BRANDS.find(b => l.includes(b.toLowerCase())) || "Outras"; };

// shortcut: depende do markup do Zoom (data-testid dos cards); se mudar, ajustar aqui.
function parseZoom(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  return [...doc.querySelectorAll('[data-testid="product-card"]')].map(c => {
    const name = (c.querySelector('[data-testid="product-card::name"]') || {}).textContent;
    const price = num((c.querySelector('[data-testid="product-card::price"]') || {}).textContent);
    const a = c.matches("a[href]") ? c : c.querySelector("a[href]") || c.closest("a[href]");
    if (!name || price == null || !a) return null;
    const img = c.querySelector("img"), via = /Via\s*([^\n<]+?)\s*(?:$|R\$|\d)/.exec(c.textContent.replace(/\s+/g, " "));
    const inst = (c.querySelector('[data-testid="product-card::installment"]') || {}).textContent;
    return {name: name.trim(), price, url: new URL(a.getAttribute("href"), "https://www.zoom.com.br").href,
      img: img ? (img.getAttribute("src") || img.getAttribute("data-src") || "") : "",
      store: via ? via[1].trim() : "Zoom", inst: inst ? inst.trim() : "", brand: brandOf(name)};
  }).filter(Boolean);
}

function applyF() {
  let r = all.filter(x => (!F.brand.size || F.brand.has(x.brand)) && (!F.store.size || F.store.has(x.store))
    && (F.min == null || x.price >= F.min) && (F.max == null || x.price <= F.max));
  if (F.sort !== "rel") r = [...r].sort((a, b) => F.sort === "asc" ? a.price - b.price : b.price - a.price);
  $("count").textContent = `${r.length} de ${all.length} resultados`;
  $("res").innerHTML = r.length ? r.map(resCard).join("") : `<p class="muted">Nenhum resultado com esses filtros.</p>`;
}
function resCard(x) {
  return `<article class="card res"><img src="${esc(x.img)}" alt="" loading="lazy"><div>
    <h3>${esc(x.name)}</h3><div class="price">${brl(x.price)}</div>
    <div class="muted">${esc(x.inst)} · ${esc(x.store)}</div>
    <div class="row"><a class="btn" href="${esc(x.url)}">Ver</a>
    <button class="btn primary" data-track="${esc(x.url)}">Rastrear</button></div></div></article>`;
}
function facets() {
  const group = (key, id) => {
    const c = {}; all.forEach(x => c[x[key]] = (c[x[key]] || 0) + 1);
    $(id).innerHTML = $(id).firstElementChild.outerHTML + Object.keys(c).sort((a, b) => c[b] - c[a]).map(v =>
      `<label class="opt"><input type="checkbox" data-k="${key}" value="${esc(v)}" ${F[key].has(v) ? "checked" : ""}>${esc(v)} <span class="muted">(${c[v]})</span></label>`).join("");
  };
  group("brand", "fbrand"); group("store", "fstore");
}
async function search(term) {
  term = term.trim(); if (!term) return;
  $("res").innerHTML = `<div class="card skel"></div><div class="card skel"></div>`; $("count").textContent = "Buscando…"; $("fbtn").hidden = true;
  const u = p => `https://www.zoom.com.br/search?q=${encodeURIComponent(term)}&page=${p}`;
  try {
    const pages = await Promise.allSettled([getHtml(u(1)), getHtml(u(2))]);
    if (pages[0].status !== "fulfilled") throw 0;
    const seen = new Set();
    all = pages.filter(p => p.status === "fulfilled").flatMap(p => parseZoom(p.value)).filter(x => !seen.has(x.url) && seen.add(x.url));
    if (!all.length) { $("res").innerHTML = `<p class="muted">Nada encontrado para "${esc(term)}".</p>`; $("count").textContent = ""; return; }
    F = {brand: new Set(), store: new Set(), sort: "rel", min: null, max: null};
    ["sort", "pmin", "pmax"].forEach(i => $(i).value = i === "sort" ? "rel" : "");
    facets(); applyF(); $("fbtn").hidden = false;
  } catch (e) {
    $("count").textContent = "";
    $("res").innerHTML = `<div class="card"><p>Não consegui buscar agora (loja bloqueou ou sem conexão).</p><button class="btn primary" id="retry">Tentar de novo</button></div>`;
    $("retry").onclick = () => search(term);
  }
}
$("chips").innerHTML = CATS.map(c => `<button class="chip" aria-pressed="false">${c}</button>`).join("");
$("chips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); q.value = b.textContent; search(q.value); };
$("sf").onsubmit = e => { e.preventDefault(); q.blur(); search(q.value); };
const drawer = $("drawer");
$("fbtn").onclick = () => { drawer.classList.add("open"); $("fclose").focus(); };
$("fclose").onclick = () => { drawer.classList.remove("open"); $("fbtn").focus(); };
drawer.onclick = e => { if (e.target === drawer) $("fclose").click(); };
drawer.onchange = e => { const t = e.target;
  if (t.dataset.k) t.checked ? F[t.dataset.k].add(t.value) : F[t.dataset.k].delete(t.value);
  F.sort = $("sort").value; F.min = parseFloat($("pmin").value) || null; F.max = parseFloat($("pmax").value) || null; applyF(); };
$("fclear").onclick = () => { F = {brand: new Set(), store: new Set(), sort: "rel", min: null, max: null};
  ["pmin", "pmax"].forEach(i => $(i).value = ""); $("sort").value = "rel"; facets(); applyF(); };

// Rastrear: acrescenta o item em docs/items.json pela API do GitHub (token fica so neste aparelho).
const API = "https://api.github.com/repos/raafaelr/price-radar/contents/docs/items.json";
$("tok").value = localStorage.getItem("pr_tok") || "";
$("tok").onchange = () => localStorage.setItem("pr_tok", $("tok").value.trim());
$("res").onclick = async e => {
  const b = e.target.closest("[data-track]"); if (!b) return;
  const tok = localStorage.getItem("pr_tok");
  if (!tok) { document.querySelector("#cat details").open = true; $("tok").focus(); return; }
  const x = all.find(i => i.url === b.dataset.track), H = {Authorization: "Bearer " + tok, Accept: "application/vnd.github+json"};
  b.disabled = true; b.textContent = "Salvando…";
  try {
    const cur = await fetch(API, {headers: H}).then(r => { if (!r.ok) throw r.status; return r.json(); });
    const items = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, "")))));
    if (!items.some(i => i.url === x.url)) items.push({name: x.name, url: x.url, target: Math.floor(x.price * 0.95)});
    const body = {message: "Rastrear: " + x.name, sha: cur.sha, content: btoa(unescape(encodeURIComponent(JSON.stringify(items, null, 1) + "\n")))};
    const put = await fetch(API, {method: "PUT", headers: H, body: JSON.stringify(body)});
    if (!put.ok) throw put.status;
    b.textContent = "✓ Rastreando (meta -5%)"; load();
  } catch (err) { b.disabled = false; b.textContent = "Erro " + err + " · tentar de novo"; }
};

function spark(h) {
  if (h.length < 2) return "";
  const v = h.map(p => p[1]), lo = Math.min(...v), hi = Math.max(...v) || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * 100},${28 - ((y - lo) / ((hi - lo) || 1)) * 24}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="Histórico de preços"><polyline points="${pts}" vector-effect="non-scaling-stroke"/></svg>`;
}

function card(it, h) {
  const link = `<a class="btn actions" href="${esc(it.url)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Ver na loja</a>`;
  if (!h.length) return `<article class="card"><h2>${esc(it.name)}</h2><p class="muted">Ainda sem leitura de preço.</p>${link}</article>`;
  const now = h[h.length - 1][1], prev = h.length > 1 ? h[h.length - 2][1] : now, min = Math.min(...h.map(p => p[1]));
  const tags = [];
  if (now < prev) tags.push(`<span class="tag good">▼ caiu ${brl(prev - now)}</span>`);
  if (now > prev) tags.push(`<span class="tag bad">▲ subiu ${brl(now - prev)}</span>`);
  if (h.length > 1 && now === min) tags.push(`<span class="tag good">Menor preço visto</span>`);
  if (it.target) tags.push(now <= it.target
    ? `<span class="tag good">✓ Na meta de ${brl(it.target)}</span>`
    : `<span class="tag">Meta ${brl(it.target)} · faltam ${brl(now - it.target)}</span>`);
  const when = new Date(h[h.length - 1][0] * 1000).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"});
  return `<article class="card"><h2>${esc(it.name)}</h2>
    <div class="price">${brl(now)}</div>
    <div class="row">${tags.join("")}</div>${spark(h)}
    <div class="muted">Menor visto: ${brl(min)} · atualizado ${when}</div>${link}</article>`;
}

function load() {
  Promise.all([
    fetch(RAW + "items.json").then(r => r.json()),
    fetch(RAW + "prices.json").then(r => r.ok ? r.json() : {})
  ]).then(([items, prices]) => {
    document.getElementById("list").innerHTML = items.length
      ? items.map(it => card(it, prices[it.url] || [])).join("")
      : `<p class="muted">Nenhum item ainda. Toque em Adicionar.</p>`;
  }).catch(() => {
    document.getElementById("list").innerHTML =
      `<div class="card"><p>Não consegui carregar os preços. Confira a conexão.</p><button class="btn primary" onclick="load()">Tentar de novo</button></div>`;
  });
}
load();
</script>
</body>
</html>
